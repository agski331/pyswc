[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyswc"
dynamic = ["version"] 
description = "Python bindings for Speedy Web Compiler (SWC)"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Aaron Gdanski" }
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
bindings = "pyo3" 