[package]
name = "pyswc"
version = "0.1.0"
edition = "2024"

[lib]
name = "pyswc"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["num-bigint", "extension-module"] }
anyhow = "1"

swc_core = { version = "78.0.0", features = [
    "common",
    "common_concurrent",
    "ecma_ast",
    "ecma_parser",
    "ecma_codegen",
    "ecma_visit",
    "ecma_transforms",
] }
num-bigint = "0.4"
